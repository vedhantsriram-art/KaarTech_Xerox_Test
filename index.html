<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex"><title>Enterprise AI Journey</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
:root{
  --bg:#FFFFFF; --bg2:#F5F3F2; --card:#FFFFFF; --ink:#1B1B1F; --muted:#5F5E66; --line:#E4E1DF; --line2:#C9C5C2;
  --red:#D12228; --red-ink:#B5191F; --red-soft:#FCEBEC; --hero:#D12228; --hero2:#A8171D;
  --blue:#4E5E74; --blue-soft:#E9EDF2; --glow:rgba(209,34,40,.45); --zone:#FAF9F8; --gov:#1B1B1F; --govt:#FFFFFF;
  --shadow:0 1px 2px rgba(27,27,31,.06),0 8px 24px rgba(27,27,31,.06);
  --font:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  --hh:64px; color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F0F12; --bg2:#16161A; --card:#1B1B20; --ink:#F3F2F1; --muted:#A5A4AC; --line:#2E2E35; --line2:#46464F;
  --red:#EB3A40; --red-ink:#FF7479; --red-soft:#3B1719; --hero:#C41E24; --hero2:#8E1318;
  --blue:#93A6BE; --blue-soft:#212733; --glow:rgba(235,58,64,.55); --zone:#141418; --gov:#2A2A31; --govt:#F3F2F1;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F0F12; --bg2:#16161A; --card:#1B1B20; --ink:#F3F2F1; --muted:#A5A4AC; --line:#2E2E35; --line2:#46464F;
  --red:#EB3A40; --red-ink:#FF7479; --red-soft:#3B1719; --hero:#C41E24; --hero2:#8E1318;
  --blue:#93A6BE; --blue-soft:#212733; --glow:rgba(235,58,64,.55); --zone:#141418; --gov:#2A2A31; --govt:#F3F2F1;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35); color-scheme:dark}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.55 var(--font);-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--red);outline-offset:3px;border-radius:6px}
.wrap{max-width:1280px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3,p{margin:0}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
h1,h2,h3{text-wrap:balance;letter-spacing:-.02em;line-height:1.08}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* header */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--bg);border-bottom:1px solid var(--line);height:var(--hh)}
.hdr .wrap{height:100%;display:flex;align-items:center;gap:14px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand img{height:46px;width:auto;background:#fff;border-radius:8px;padding:2px 6px;display:block}
.brand .x{width:1px;height:26px;background:var(--line2)}
.brand img.xl{height:32px;padding:4px 8px}
.brand .for{font-weight:600;font-size:14px;color:var(--muted);white-space:nowrap;border-left:1px solid var(--line2);padding-left:12px}
.sp{flex:1}
.chip{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;padding:6px 12px;border-radius:99px;border:1px solid var(--line2);color:var(--muted);white-space:nowrap}
.chip i{width:7px;height:7px;border-radius:50%;background:var(--red);display:block}
.tbtn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line2);background:transparent;display:grid;place-items:center}
.tbtn:hover{background:var(--bg2)}
.tbtn svg{width:20px;height:20px}
.hlink{font-weight:600;font-size:14px;padding:8px 14px;border-radius:99px}
.hlink:hover{background:var(--bg2)}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:10px;font-weight:700;font-size:15px;padding:13px 26px;border-radius:99px;border:2px solid transparent;transition:transform .2s,background .2s,color .2s}
.btn:hover{transform:translateY(-2px)}
.btn.solid{background:#fff;color:var(--hero2)}
.btn.line{border-color:#fff;color:#fff}
.btn.line:hover{background:#fff;color:var(--hero2)}
.btn.red{background:var(--red);color:#fff}
.btn.ghost{border-color:var(--line2);color:var(--ink)}
.btn.ghost:hover{background:var(--bg2)}
.btn svg{width:18px;height:18px}

/* hero */
.hero{position:relative;background:var(--hero);color:#fff;overflow:hidden;isolation:isolate}
.hero::before{content:"";position:absolute;inset:0;z-index:-1;
  background:radial-gradient(circle,rgba(255,255,255,.2) 1.3px,transparent 1.6px) 0 0/24px 24px;
  -webkit-mask-image:linear-gradient(100deg,#000 0%,rgba(0,0,0,.15) 55%,transparent 80%);mask-image:linear-gradient(100deg,#000 0%,rgba(0,0,0,.15) 55%,transparent 80%)}
.hero::after{content:"";position:absolute;right:-12%;top:-40%;width:90vmin;height:90vmin;border-radius:50%;z-index:-1;
  background:radial-gradient(circle at 50% 50%,rgba(255,255,255,.16),transparent 62%)}
.hero .wrap{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:24px;align-items:center;padding-block:56px 64px}
.hero h1{font-size:clamp(38px,5.4vw,68px);font-weight:800;letter-spacing:-.035em;line-height:1.02;max-width:12ch}
.hero .sub{font-size:clamp(17px,1.6vw,21px);line-height:1.45;margin-top:20px;max-width:34em;color:rgba(255,255,255,.92)}
.hero .tag{display:inline-flex;align-items:center;gap:9px;font-size:13px;font-weight:600;padding:7px 14px;border-radius:99px;background:rgba(255,255,255,.16);margin-bottom:22px}
.hero .tag i{width:8px;height:8px;border-radius:50%;background:#fff;animation:blink 2.4s ease-in-out infinite}
.hero .cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:32px}
@keyframes blink{50%{opacity:.25}}

/* stack */
.stack{position:relative;width:100%;max-width:640px;margin-left:auto;aspect-ratio:640/470}
@supports not (aspect-ratio:1/1){.stack{height:0;padding-bottom:73.4%}}
.stack svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.slab{cursor:pointer;transform-box:fill-box;animation:drop .8s cubic-bezier(.2,.85,.25,1) both;animation-delay:calc(var(--i)*.12s)}
.slab .lift{transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.slab.hov .lift{transform:translateY(-10px)}
.slab .top{fill:rgba(255,255,255,var(--a))}
.slab .lf{fill:rgba(0,0,0,.14)}.slab .rt{fill:rgba(0,0,0,.26)}
.slab .glow{fill:#fff;opacity:0;animation:climb 5.6s ease-in-out infinite;animation-delay:calc(1.4s + var(--i)*.38s)}
.slab .edge{fill:none;stroke:rgba(255,255,255,.55);stroke-width:1}
@keyframes drop{from{opacity:0;transform:translateY(-46px)}to{opacity:1;transform:none}}
@keyframes climb{0%{opacity:0}5%{opacity:.6}14%{opacity:0}100%{opacity:0}}
.slabl{position:absolute;left:var(--lx);top:var(--ly);transform:translateY(-50%);display:flex;align-items:center;gap:10px;color:#fff;font-weight:600;font-size:clamp(11px,1.5vw,15px);white-space:nowrap;
  padding:5px 12px 5px 6px;border-radius:99px;border:1px solid rgba(255,255,255,.0);animation:fin .6s both;animation-delay:calc(.5s + var(--i)*.12s);transition:background .2s,color .2s,border-color .2s}
.slabl b{display:inline-grid;place-items:center;min-width:2.1em;height:2.1em;border-radius:99px;background:rgba(255,255,255,.2);font-weight:800;font-size:.9em}
.slabl.hov{background:#fff;color:var(--hero2);border-color:#fff}.slabl.hov b{background:var(--hero)}.slabl.hov b{color:#fff}
@keyframes fin{from{opacity:0;transform:translate(-8px,-50%)}to{opacity:1;transform:translate(0,-50%)}}
.stackcap{position:absolute;right:0;bottom:-4px;font-size:12.5px;color:rgba(255,255,255,.8);display:flex;gap:8px;align-items:center}

/* sections */
.sec{padding-block:72px}
.sec.alt{background:var(--bg2)}
.sec h2{font-size:clamp(28px,3.4vw,44px);font-weight:800;max-width:20ch}
.sec .lead{color:var(--muted);font-size:18px;margin-top:14px;max-width:40em}

/* ladder */
.ladder{display:flex;flex-direction:column;gap:12px;margin-top:40px}
.rung{--ind:calc(var(--n)*3.2%);margin-left:var(--ind);display:grid;grid-template-columns:76px minmax(0,1fr) auto;gap:20px;align-items:center;padding:18px 24px 18px 18px;border:1px solid var(--line);border-radius:18px;background:var(--card);
  transition:transform .25s cubic-bezier(.2,.8,.2,1),box-shadow .25s,border-color .25s;position:relative;overflow:hidden}
.rung::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--red);transform-origin:bottom;transform:scaleY(calc((var(--n) + 1)/7));transition:transform .4s}
.rung:hover{transform:translateX(6px);box-shadow:var(--shadow);border-color:var(--red)}
.rung .rn{display:grid;place-items:center;width:64px;height:64px;border-radius:16px;background:var(--red-soft);color:var(--red-ink);font-weight:800;font-size:22px;letter-spacing:-.02em}
.rung .nm{font-weight:800;font-size:clamp(18px,2vw,23px);letter-spacing:-.02em;line-height:1.15}
.rung .th{color:var(--red-ink);font-weight:600;font-size:14.5px;margin-top:3px}
.rung .ou{color:var(--muted);font-size:14.5px;margin-top:6px;max-width:60em}
.rung .rm{display:flex;flex-direction:column;align-items:flex-end;gap:8px;font-size:13px;color:var(--muted);white-space:nowrap}
.pips{display:flex;gap:3px;align-items:flex-end}
.pips i{width:8px;border-radius:2px;background:var(--line2);display:block}
.pips i.on{background:var(--red)}
.rung.today .rn{background:var(--bg2);color:var(--ink)}

/* how shown */
.how{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;margin-top:40px}
.hc{border:1px solid var(--line);border-radius:20px;padding:26px;background:var(--card);display:flex;flex-direction:column;gap:14px;transition:transform .25s,box-shadow .25s}
.hc:hover{transform:translateY(-4px);box-shadow:var(--shadow)}
.hc h3{font-size:22px;font-weight:800}
.hc p{color:var(--muted);font-size:15.5px}
.hc svg{width:100%;height:120px;border-radius:12px;background:var(--bg2)}
.hc .btn{align-self:flex-start;margin-top:auto}

/* footer */
.ftr{border-top:1px solid var(--line);padding-block:26px;color:var(--muted);font-size:13.5px}
.ftr .wrap{display:flex;flex-wrap:wrap;gap:10px 24px;align-items:center}

/* level hero */
.lhero .wrap{grid-template-columns:minmax(0,1.2fr) minmax(0,.8fr);padding-block:44px 52px}
.lhero .crumbs{display:flex;gap:10px;align-items:center;font-size:14px;font-weight:600;color:rgba(255,255,255,.85);margin-bottom:14px}
.lhero .crumbs a:hover{text-decoration:underline}
.lhero .num{font-size:clamp(84px,13vw,170px);font-weight:800;letter-spacing:-.06em;line-height:.85;color:transparent;-webkit-text-stroke:2px rgba(255,255,255,.9);margin-bottom:8px}
.lhero h1{font-size:clamp(32px,4.4vw,56px);max-width:16ch}
.lhero .th{font-size:19px;font-weight:600;margin-top:12px}
.lhero .oc{margin-top:12px;color:rgba(255,255,255,.9);max-width:36em;font-size:17px}
.bars{display:flex;align-items:flex-end;gap:8px;height:230px;justify-self:end;width:100%;max-width:420px}
.bars a{flex:1;display:flex;align-items:flex-end;justify-content:center;border-radius:10px 10px 4px 4px;background:rgba(255,255,255,.18);color:#fff;font-weight:700;font-size:14px;padding-bottom:8px;height:var(--h);transition:transform .25s,background .25s;position:relative;transform-origin:bottom;animation:grow .7s cubic-bezier(.2,.9,.2,1) both;animation-delay:calc(var(--k)*.07s)}
.bars a.p{background:rgba(255,255,255,.38)}
.bars a.c{background:#fff;color:var(--hero2);box-shadow:0 10px 30px rgba(0,0,0,.25)}
.bars a:hover{transform:translateY(-6px);background:rgba(255,255,255,.7);color:var(--hero2)}
.bars a.c:hover{background:#fff}
@keyframes grow{from{transform:scaleY(.1);opacity:0}to{transform:none;opacity:1}}

.tabs{position:sticky;top:calc(var(--hh) + env(safe-area-inset-top,0px));z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.tabs .wrap{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.tab{position:relative;padding:18px 20px;font-weight:700;font-size:16px;color:var(--muted);border:0;background:none;white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab[aria-selected=true]{color:var(--red-ink)}
.tab::after{content:"";position:absolute;left:14px;right:14px;bottom:-1px;height:3px;background:var(--red);border-radius:3px 3px 0 0;transform:scaleX(0);transition:transform .3s}
.tab[aria-selected=true]::after{transform:scaleX(1)}
.tab small{font-weight:600;opacity:.7;margin-left:6px}

.panel{padding-block:44px 24px;animation:pin .5s cubic-bezier(.2,.8,.2,1) both}
@keyframes pin{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.ph{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end;justify-content:space-between;margin-bottom:28px}
.ph h2{font-size:clamp(26px,3vw,38px);font-weight:800}
.ph p{color:var(--muted);max-width:44em;margin-top:8px}
.note{display:inline-flex;gap:10px;align-items:flex-start;padding:10px 16px;border-radius:12px;background:var(--red-soft);color:var(--red-ink);font-weight:600;font-size:14px;max-width:48em}

/* scope lanes */
.lanes{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:32px;align-items:start}
.lane{border:1px solid var(--line);border-radius:22px;background:var(--card);overflow:hidden;margin-bottom:22px}
.lane>header{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between;padding:18px 24px;background:var(--bg2);border-bottom:1px solid var(--line)}
.lane .fl{font-weight:800;font-size:20px;letter-spacing:-.015em}
.lane .fl small{display:block;font-weight:600;color:var(--red-ink);font-size:13px;letter-spacing:0;margin-bottom:2px}
.chain{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:16px 24px 6px}
.chain span{font-size:12.5px;font-weight:600;padding:5px 11px;border-radius:99px;background:var(--blue-soft);color:var(--ink);border:1px solid var(--line)}
.chain span.n{background:var(--red);color:#fff;border-color:var(--red)}
.chain svg{width:16px;height:16px;color:var(--line2);flex:none}
.chain svg path{stroke-dasharray:3 3;animation:dash 1s linear infinite}
.dl{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;padding:16px 24px 24px}
.dc{position:relative;padding:20px 20px 18px 20px;border-radius:16px;border:1px solid var(--line);background:var(--bg);transition:transform .25s,border-color .25s,box-shadow .25s}
.dc:hover{transform:translateY(-3px);border-color:var(--red);box-shadow:var(--shadow)}
.dc .dn{font-weight:800;font-size:13px;color:var(--red-ink);margin-bottom:6px}
.dc h3{font-size:19px;font-weight:800;margin-bottom:8px}
.dc p{color:var(--muted);font-size:14.5px;line-height:1.5}
.aside{position:sticky;top:calc(var(--hh) + 72px);border:1px solid var(--line);border-radius:22px;padding:22px;background:var(--card)}
.aside h3{font-size:18px;font-weight:800;margin-bottom:14px}
.cl{display:flex;flex-wrap:wrap;gap:8px}
.cl span{font-size:13px;font-weight:600;padding:6px 12px;border-radius:99px;background:var(--red-soft);color:var(--red-ink);animation:pop .5s both;animation-delay:calc(var(--k)*.05s)}
@keyframes pop{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:none}}

/* architecture */
.flows{scroll-margin-top:150px;display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin-bottom:20px}
.fc{text-align:left;border:1.5px solid var(--line);border-radius:18px;padding:16px 18px 18px;background:var(--card);display:flex;flex-direction:column;gap:6px;transition:transform .25s,border-color .25s,box-shadow .25s;position:relative;overflow:hidden}
.fc:hover{transform:translateY(-3px);border-color:var(--red)}
.fc .k{display:flex;align-items:center;gap:8px;font-weight:700;font-size:13px;color:var(--red-ink)}
.fc .k svg{width:16px;height:16px}
.fc b{font-size:17px;font-weight:800;letter-spacing:-.01em;line-height:1.2}
.fc span.s{font-size:13.5px;color:var(--muted);line-height:1.4}
.fc[aria-pressed=true]{border-color:var(--red);box-shadow:0 0 0 3px var(--red-soft),var(--shadow)}
.fc .pg{position:absolute;left:0;bottom:0;height:4px;background:var(--red);width:0;transition:width .5s}
.fc[aria-pressed=false] .pg{width:0!important}
.legend{display:flex;flex-wrap:wrap;gap:8px 20px;font-size:13px;color:var(--muted);font-weight:600;margin-bottom:12px;align-items:center}
.legend i{display:inline-block;width:18px;height:12px;border-radius:4px;margin-right:7px;vertical-align:-1px;border:1.5px solid}
.lg-new{background:var(--red);border-color:var(--red)!important}
.lg-prev{background:var(--blue-soft);border-color:var(--blue)!important}
.lg-today{background:var(--card);border-color:var(--ink)!important}
.archbox{border:1px solid var(--line);border-radius:22px;background:var(--card);overflow:hidden}
.archscroll{overflow-x:auto;padding:14px}
.archscroll svg{display:block;width:100%;min-width:1180px;height:auto}
.archbox.wide{position:relative;left:50%;transform:translateX(-50%);width:min(1500px,calc(100vw - 24px))}
.archnote{display:grid;gap:8px;margin:14px 0 0;font-size:14px;color:var(--muted);line-height:1.45}
.archnote b{color:var(--ink)}
.narr{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:28px;border-top:1px solid var(--line);padding:22px 26px;background:var(--bg2);align-items:start}
.cap{font-size:clamp(19px,2vw,25px);font-weight:700;letter-spacing:-.015em;line-height:1.25;min-height:3.8em}
.cap .cur{display:inline-block;width:2px;height:1em;background:var(--red);margin-left:3px;vertical-align:-.12em;animation:blink 1s steps(1) infinite}
.cap small{display:block;font-size:13.5px;font-weight:600;color:var(--red-ink);letter-spacing:0;margin-bottom:6px}
[hidden]{display:none!important}
.ctl{display:flex;gap:8px;margin-top:16px;align-items:center}
.ctl button{width:42px;height:42px;border-radius:50%;border:1.5px solid var(--line2);background:var(--card);display:grid;place-items:center}
.ctl button:hover{border-color:var(--red);color:var(--red-ink)}
.ctl button.pl{background:var(--red);border-color:var(--red);color:#fff;width:48px;height:48px}
.ctl svg{width:18px;height:18px}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;counter-reset:s}
.steps li{display:grid;grid-template-columns:30px 1fr;gap:12px;align-items:start;padding:8px 12px;border-radius:12px;font-size:14.5px;line-height:1.4;color:var(--muted);cursor:pointer;transition:background .25s,color .25s}
.steps li::before{counter-increment:s;content:counter(s);display:grid;place-items:center;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line2);font-weight:700;font-size:12.5px;transition:all .25s}
.steps li:hover{background:var(--card)}
.steps li.d{color:var(--ink)}.steps li.d::before{background:var(--red-soft);border-color:var(--red);color:var(--red-ink)}
.steps li.a{background:var(--card);color:var(--ink);font-weight:600;box-shadow:var(--shadow)}.steps li.a::before{background:var(--red);border-color:var(--red);color:#fff}
.hint{display:flex;gap:12px;align-items:center;color:var(--muted);font-size:15.5px}
.hint svg{width:34px;height:34px;color:var(--red)}
.added{margin-top:22px}
.added h3{font-size:16px;font-weight:800;margin-bottom:10px}

/* svg diagram */
.zn{fill:var(--zone);stroke:var(--line);stroke-width:1}
.zt{font:700 12px var(--font);fill:var(--muted);letter-spacing:.01em}
.zr{font:italic 500 11px var(--font);fill:var(--muted);paint-order:stroke;stroke-width:4px;stroke-linejoin:round}
.zt{paint-order:stroke;stroke-width:4px;stroke-linejoin:round;stroke:var(--zone)}
.z-sub .zt,.z-sub .zr{stroke:var(--bg2)}
.z-btp .zr,.z-bdc .zr,.z-cust .zr{stroke:var(--zone)}
.z-ext .zt,.z-ext .zr{stroke:color-mix(in srgb,var(--red-soft) 55%,var(--zone))}
.z-btp .zn,.z-bdc .zn{fill:var(--zone);stroke:var(--blue);stroke-width:1.6;stroke-dasharray:7 5}
.z-btp .zt,.z-bdc .zt{fill:var(--blue);font-size:13.5px;font-weight:800}
.z-sub .zn{fill:var(--bg2);stroke:var(--line2)}
.z-sub .zt{fill:var(--blue);font-weight:700}
.z-ext .zn{fill:var(--red-soft);fill-opacity:.55;stroke:var(--red);stroke-width:1.5;stroke-dasharray:6 4}
.z-ext .zt{fill:var(--red-ink);font-weight:800;font-size:12.5px}
.z-ext .zr{fill:var(--red-ink)}
.netedge line{stroke:var(--line2);stroke-width:1.4}
.netedge text{font:700 11px var(--font);fill:var(--muted)}
.se{fill:none;stroke:var(--line2);stroke-width:1.2}
.se.nw{stroke:var(--red);stroke-width:1.6;opacity:.7}
.nd .box{stroke-width:1.3;transition:opacity .3s,fill .3s,stroke .3s}
.nd.new .box{fill:var(--red);stroke:var(--red)}
.nd.prev .box{fill:var(--blue-soft);stroke:var(--blue)}
.nd.today .box{fill:var(--card);stroke:var(--ink)}
.nd .t{font:700 13px var(--font);fill:var(--ink)}
.nd .s{font:500 10px var(--font);fill:var(--muted)}
.nd.new .t{fill:#fff}.nd.new .s{fill:rgba(255,255,255,.88)}
.nd .halo{fill:none;stroke:var(--red);stroke-width:0;opacity:0}
.nd{transition:opacity .3s}
.dimmed .nd:not(.lit){opacity:.28}
.dimmed .zn{opacity:.6}
.dimmed .se{opacity:.25}
.nd.lit .halo{opacity:1;stroke-width:3;animation:halo 1.6s ease-in-out infinite}
.nd.act .box{stroke:var(--red);stroke-width:2.2}
.nd.act.prev .box,.nd.act.today .box{fill:var(--red-soft)}
@keyframes halo{50%{stroke-width:7;opacity:.35}}
.hp{fill:none;stroke-linecap:round;stroke-linejoin:round;display:none;transition:opacity .4s,stroke .4s}
.sel .hp{display:block}
.hp.fut{stroke:var(--line2);stroke-width:1.6;stroke-dasharray:3 6;opacity:.9}
.hp.on{stroke:var(--red);stroke-width:2.2;opacity:.55;stroke-dasharray:6 7;animation:dash 1.8s linear infinite}
.hp.act{stroke:var(--red);stroke-width:3;stroke-dasharray:8 7;animation:dash .7s linear infinite;filter:drop-shadow(0 0 4px var(--glow))}
.hp.hid{display:none!important}
@keyframes dash{to{stroke-dashoffset:-30}}
.lab{opacity:0;transition:opacity .35s;pointer-events:none}
.lab.act{opacity:1}
.lab rect{fill:var(--red);}
.lab text{font:700 10.5px var(--font);fill:#fff}
.gov rect{fill:var(--gov)}
.gov text{font:700 11.5px var(--font);fill:var(--govt);letter-spacing:.01em}
.gap rect{fill:none;stroke:var(--red);stroke-width:1.6;stroke-dasharray:5 5;animation:dash 3s linear infinite}
.gap text{font:700 13px var(--font);fill:var(--red-ink)}
.cen{fill:none;stroke:var(--line2);stroke-width:1.4;stroke-dasharray:3 6;animation:dash 4s linear infinite}
.pl rect{fill:var(--bg2);stroke:var(--line2)}
.pl text{font:600 11.5px var(--font);fill:var(--ink)}
.gh{font:800 13px var(--font);fill:var(--ink)}

/* outcome */
.oban{border-radius:24px;background:var(--hero);color:#fff;padding:36px clamp(22px,4vw,48px);position:relative;overflow:hidden;isolation:isolate}
.oban::before{content:"";position:absolute;inset:0;z-index:-1;background:radial-gradient(circle,rgba(255,255,255,.2) 1.3px,transparent 1.6px) 0 0/22px 22px;-webkit-mask-image:linear-gradient(90deg,transparent 40%,#000);mask-image:linear-gradient(90deg,transparent 40%,#000)}
.oban small{font-weight:700;font-size:14px;opacity:.9}
.oban p{font-size:clamp(22px,3vw,36px);font-weight:800;letter-spacing:-.025em;line-height:1.15;margin-top:10px;max-width:26em}
.og{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px;margin-top:24px}
.ob{border:1px solid var(--line);border-radius:22px;padding:26px;background:var(--card)}
.ob h3{font-size:19px;font-weight:800;margin-bottom:16px}
.tests{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.tests li{display:grid;grid-template-columns:36px 1fr;gap:14px;align-items:start;font-size:16px;line-height:1.4;animation:pin .6s both;animation-delay:calc(.15s + var(--k)*.15s)}
.tests li i{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--red);color:#fff;font-style:normal;font-weight:800;font-size:14px}
.kp{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.kp div{display:flex;gap:10px;align-items:flex-start;padding:14px;border-radius:14px;background:var(--bg2);font-weight:600;font-size:14.5px;line-height:1.3;animation:pop .5s both;animation-delay:calc(.2s + var(--k)*.07s)}
.kp svg{width:20px;height:20px;color:var(--red);flex:none;margin-top:1px}
.next{margin-top:24px;display:flex;flex-wrap:wrap;gap:14px 24px;align-items:center;justify-content:space-between;border:1.5px dashed var(--line2);border-radius:22px;padding:22px 28px}
.next b{font-size:20px;font-weight:800;letter-spacing:-.015em}
.pager{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-block:36px 56px}

@media (max-width:980px){
  .hero .wrap,.lhero .wrap{grid-template-columns:1fr;padding-block:40px 44px}
  .stack{margin:8px auto 0}
  .how,.og{grid-template-columns:1fr}
  .lanes{grid-template-columns:1fr}
  .aside{position:static}
  .narr{grid-template-columns:1fr}
  .rung{--ind:0%}
  .bars{justify-self:start;height:170px}
}
@media (max-width:640px){
  .brand .x{width:1px;height:26px;background:var(--line2)}
.brand img.xl{height:32px;padding:4px 8px}
.brand .for{display:none}.chip{display:none}.brand{gap:8px}.brand img{height:32px}.brand img.xl{height:28px}
  .rung{grid-template-columns:52px minmax(0,1fr);padding:14px}
  .rung .rn{width:48px;height:48px;font-size:17px;border-radius:12px}
  .rung .rm{display:none}
  .kp{grid-template-columns:1fr}
  .sec{padding-block:48px}
  .dl{padding:12px 16px 18px}.chain{padding:14px 16px 4px}.lane>header{padding:16px}
  .narr{padding:18px}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
  .slab,.slabl,.bars a{opacity:1!important}
}
</style>

ata pipelines","d":"Real-time or near real-time data pipelines between plant systems, the ERP, the data platform (for example Datasphere), and analytics tools (for example SAC or Power BI).","f":1},{"t":"Enterprise KPI framework","d":"Enterprise KPI framework across production, maintenance, quality, energy, finance, procurement, supply chain, and inventory.","f":2},{"t":"Cross-system reporting","d":"Cross-system reporting and dashboards for executives, plant operations, finance, cost, procurement, maintenance, and quality.","f":2},{"t":"Priority use cases","d":"Priority use cases: production cost visibility, supplier performance, energy tracking, inventory visibility, maintenance backlog, and quality trends.","f":3}],"tests":["Every dashboard shows the same figure as its source system on the day of testing","Plant data arrives within the time we commit for each feed","The named business users are trained and using the dashboards in their daily work","The business signs acceptance for each KPI"],"kpis":["Real-time dashboards implemented","Single source of truth for priority KPIs","ERP and other systems integrated","Manual data consolidation reduced","Data latency reduced","Dashboard adoption measured"],"flows":[{"name":"Sources into one governed layer","sub":"Deliverables 1 and 2: ERP, other business and process data meet in one semantic layer.","hops":[["s_erp","i_int",null],["s_proc","i_evt","Process events"],["i_int","c_src",null],["c_src","c_sem",null],["c_sem","c_dp",null]],"steps":["ERP data leaves through released APIs","Process systems publish events as they happen","Each source lands in its own space, kept apart","The semantic layer joins them with one set of definitions","A certified data product is published"]},{"name":"One figure on every dashboard","sub":"Deliverables 3 and 4: existing dashboards are re-pointed to the same certified product.","hops":[["c_dp","c_dash","Live connection"],["c_dp","c_rep","Re-pointed"],["c_dash","e_user","Same figure as source"]],"steps":["New dashboards read the certified product live","Existing dashboards are re-pointed to the same product, not rebuilt","Users see the same figure as the source system"]},{"name":"An exception reaches a person","sub":"Deliverable 5: a priority use case, from an event to the person who acts.","hops":[["s_proc","i_evt","Event as it happens"],["i_evt","b_alert","Exception alert"],["b_alert","e_user","Reaches the person"]],"steps":["A process system publishes an event","Event streaming passes it to alerting","The responsible person is alerted and acts"]}]},{"n":3,"name":"Intelligent Enterprise","theme":"Identify, prioritize, predict","outcome":"Predictive AI models and AI recommendations embedded into workflows.","deliv":[{"t":"Use-case prioritization","d":"AI use case prioritization by value, feasibility, data readiness, risk, and roadmap fit.","f":1},{"t":"Predictive maintenance","d":"Predictive maintenance models for critical plant equipment, and work order recommendations.","f":2},{"t":"Demand forecasting","d":"Demand forecasting for demand, dispatch, sales, and inventory.","f":2},{"t":"Cost prediction","d":"Cost prediction models for production, energy, maintenance, and raw material trends.","f":2},{"t":"AI inside ERP workflows","d":"AI recommendations embedded into ERP workflows and screens (for example Fiori apps) for maintenance, procurement, finance, inventory, and cost anomalies.","f":3},{"t":"ModelOps and AI governance","d":"ModelOps and AI governance covering lifecycle, monitoring, drift, accuracy, approval workflows, and audit logs.","f":3}],"tests":["Each model reaches the accuracy we commit, measured on the customer's own data over an agreed test period","The recommendations appear in the live ERP workflow and are used by the responsible team","The monitoring and retraining process is handed over and demonstrated to the customer's staff"],"kpis":["Reduced unplanned downtime","Improved forecast accuracy","AI recommendations embedded in workflows","Cost prediction accuracy measured","Predictive use cases in production","Business value realized"],"flows":[{"name":"Prioritize use cases","sub":"Deliverable 1: the long list is scored and the confirmed portfolio feeds the build.","hops":[["e_user","e_work","Long list"],["e_work","ai_ops","Portfolio confirmed"]],"steps":["Business users bring the use-case long list","Workshops score each on value, feasibility, data readiness, risk and roadmap fit","The confirmed portfolio enters ModelOps for build"]},{"name":"Train and release models","sub":"Deliverables 2, 3 and 4: models train on certified data and reach production only through approval.","hops":[["c_dp","c_feat",null],["c_feat","ai_ml","Training run"],["ai_ml","ai_ops",null]],"steps":["Features are built on the certified data products","The model platform trains and tests the model","ModelOps records the run and holds the approval before release"]},{"name":"A recommendation in the workflow","sub":"Deliverables 5 and 6: the prediction appears in the screen people already use; a person decides.","hops":[["ai_ml","ai_rec",null],["ai_rec","e_screen","In the screen"],["e_screen","e_user",null],["ai_rec","ai_ops",null]],"steps":["The model is served to the recommendation service","The result appears inside the business application","The person accepts, adjusts or dismisses","Every decision returns as feedback; drift is watched"]}]},{"n":4,"name":"Assisted Enterprise","theme":"Activate human and AI collaboration","outcome":"Human and AI collaboration through AI assistants inside the tools people use.","suggested":"Scope follows the RFP objectives; closing tests and KPIs are suggested.","deliv":[{"t":"Assistant activation readiness","d":"Technical activation, role-based access, security and identity for AI assistants.","f":1},{"t":"Standard assistants","d":"AI assistants for finance, procurement and cost.","f":1},{"t":"Custom assistants","d":"Custom assistants for the use cases prioritized in the previous level, such as production, maintenance and quality.","f":2},{"t":"Conversational UX","d":"Conversational UX and a prompt library, with user training and a feedback loop.","f":3},{"t":"Adoption monitoring","d":"Usage, satisfaction and productivity tracked against a baseline.","f":3}],"tests":["Assistants answer from live governed data, as the requesting user","Active users and usage measured","User satisfaction and productivity baseline met"],"kpis":["Active users and sessions","Time saved on target tasks","User satisfaction","Answers shown with their source","Assistants live per business domain","Adoption by role"],"flows":[{"name":"Ask a business question","sub":"Deliverables 1 and 2: the assistant answers as the requesting user, from governed data.","hops":[["e_user","e_ass",null],["e_ass","ai_asst",null],["ai_asst","b_idp","Runs as the user"],["ai_asst","c_dp","Governed query"],["ai_asst","e_ass",null]],"steps":["The user asks in natural language","The assistant resolves the intent and checks the role","Identity services carry the user, not a service account","It reads certified data products","The answer returns with its source"]},{"name":"Build a custom assistant","sub":"Deliverable 3: a prioritized use case becomes a governed assistant.","hops":[["e_work","ai_studio",null],["ai_studio","ai_gen",null],["ai_studio","ai_asst",null],["ai_asst","e_ass",null]],"steps":["The portfolio names the use case","The builder adds grounding and prompts on managed foundation models","The assistant is published","Users reach it in the assistant interface"]},{"name":"Use it, rate it, measure it","sub":"Deliverables 4 and 5: feedback and usage are captured for every answer.","hops":[["e_user","e_ass",null],["e_ass","ai_asst",null],["ai_asst","b_mon","Usage measured"]],"steps":["Users ask and rate the answer","Feedback is kept with the answer","Usage and adoption are measured by role"]}]},{"n":5,"name":"Autonomous Operations","theme":"Agents execute, people approve","outcome":"AI agents ex   }
  const next=lv<6?`<div class="next"><b>${lv>0?`Level ${lv+1} builds on this.`:'Level 1 is the first step up.'}</b><a class="btn red" href="#l${lv+1}">Go to Level ${lv+1} ${IC.arr}</a></div>`:'';
  $('#panel').innerHTML=`<div class="ph"><div><h2>${esc(L.name)}: outcome</h2><p>${lv>0?'What the level delivers, how the customer closes it, and how it is measured.':'Where the customer is today.'}</p></div>${sg?`<div class="note">${esc(sg)}</div>`:''}</div>
  <div class="oban"><small>Outcome</small><p>${esc(L.outcome)}</p></div>${body}${next}`;
}

/* ---------- architecture view + flows ---------- */
function archView(){
  const {lv}=S,L=LV[lv];
  if(lv===0){
    $('#panel').innerHTML=`<div class="ph"><div><h2>L0 Baseline Operations: the landscape today</h2><p>The business as it runs now. The boxes at the sides are in place today; the centre lists the gaps that Levels 1 to 6 close.</p></div></div>
    <div class="legend"><span><i class="lg-today"></i>in place today</span></div>
    <div class="archbox"><div class="archscroll">${l0SVG()}</div></div>`;
    fitText($('#panel'));return;
  }
  const flows=L.flows.map((f,i)=>`<button class="fc" data-i="${i}" aria-pressed="false"><span class="k">${IC.play}Flow ${i+1}</span><b>${esc(f.name)}</b><span class="s">${esc(f.sub)}</span><span class="pg"></span></button>`).join('');
  $('#panel').innerHTML=`<div class="ph"><div><h2>${esc(L.name)}: architecture</h2><p>${esc(L.theme)}. Choose a flow to watch it run through the diagram.</p></div></div>
  <div class="flows">${flows}</div>
  <div class="legend"><span><i class="lg-prev"></i>built at an earlier level</span><span><i class="lg-today"></i>in place today</span><span><i class="lg-new"></i>added at this level</span></div>
  <div class="archbox wide"><div class="archscroll" id="archhost">${archSVG(lv)}</div>
    <div class="narr"><div><div class="cap" id="cap"><div class="hint">${IC.click}<span>Choose a flow above to see how it runs across the architecture.</span></div></div>
      <div class="ctl" id="ctl" hidden><button id="bp" aria-label="Previous step">${IC.prev}</button><button id="bpl" class="pl" aria-label="Play or pause">${IC.pause}</button><button id="bn" aria-label="Next step">${IC.next}</button></div></div>
      <ol class="steps" id="steps"></ol></div></div>
  <div class="added"><h3>Added at this level</h3><div class="cl">${addedChips(lv)}</div></div>`;
  fitText($('#panel'));
  $$('.fc').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;try{history.replaceState(null,'','#l'+lv+'-architecture-f'+(i+1))}catch(e){}selectFlow(i)});
  $('#bp').onclick=()=>{if(S.flow==null)return;stopPlay();setStep(S.step-1)};
  $('#bn').onclick=()=>{if(S.flow==null)return;stopPlay();setStep(S.step+1)};
  $('#bpl').onclick=()=>{
    if(S.play){stopPlay();paintPlay();return}
    const f=LV[S.lv].flows[S.flow];if(!f)return;if(S.step>=f.steps.length-1)S.step=-1;
    S.play=true;paintPlay();tick();
  };
  if(S.flow!=null)selectFlow(S.flow);
}
function paintPlay(){
  const b=$('#bpl');if(!b)return;
  const f=LV[S.lv].flows[S.flow];const end=f&&S.step>=f.steps.length-1&&!S.play;
  b.innerHTML=S.play?IC.pause:(end?IC.replay:IC.play);
}
function selectFlow(i){
  stopPlay();clearTimeout(typeT);
  const L=LV[S.lv],f=L.flows[i];S.flow=i;S.step=-1;
  $$('.fc').forEach(b=>b.setAttribute('aria-pressed',b.dataset.i==i));
  const svg=$('#archsvg');svg.classList.add('sel','dimmed');
  $('#ctl').hidden=false;
  $('#steps').innerHTML=f.steps.map((s,k)=>`<li data-k="${k}">${esc(s)}</li>`).join('');
  $$('#steps li').forEach(li=>li.onclick=()=>{stopPlay();setStep(+li.dataset.k)});
  const used=new Set();f.hops.forEach(h=>{used.add(h[0]);used.add(h[1])});
  $$('.nd',svg).forEach(g=>g.classList.toggle('lit',used.has(g.dataset.id)));
  $$('.hp',svg).forEach(p=>p.classList.toggle('hid',+p.dataset.f!==i));
  if(RM){setStep(f.steps.length-1)}else{S.play=true;tick()}
}
function tick(){
  clearTimeout(timer);timer=null;
  const f=LV[S.lv].flows[S.flow];if(!f||!S.play)return;
  if(document.hidden){timer=setTimeout(tick,600);return}
  if(S.step>=f.steps.length-1){S.play=false;paintPlay();return}
  setStep(S.step+1);
  timer=setTimeout(tick,3400);
}
function setStep(k){
  const f=LV[S.lv].flows[S.flow];if(!f)return;
  const ns=f.steps.length,nh=f.hops.length;
  k=Math.max(0,Math.min(ns-1,k));S.step=k;
  const svg=$('#archsvg');if(!svg)return;
  $$('.hp',svg).forEach(p=>{
    if(+p.dataset.f!==S.flow)return;
    const hs=stepOfHop(+p.dataset.h,nh,ns);
    p.classList.remove('fut','on','act');p.classList.add(hs<k?'on':hs===k?'act':'fut');
    p.setAttribute('marker-end',hs<=k?'url(#mkr)':'url(#mkg)');
  });
  $$('.lab',svg).forEach(l=>{l.classList.toggle('act',+l.dataset.f===S.flow&&stepOfHop(+l.dataset.h,nh,ns)===k)});
  const act=new Set();
  f.hops.forEach((h,j)=>{if(stepOfHop(j,nh,ns)===k){act.add(h[0]);act.add(h[1])}});
  if(!act.size){let last=-1;f.hops.forEach((h,j)=>{if(stepOfHop(j,nh,ns)<k)last=j});if(last>=0)act.add(f.hops[last][1])}
  $$('.nd',svg).forEach(g=>g.classList.toggle('act',act.has(g.dataset.id)));
  $$('#steps li').forEach((li,i)=>{li.classList.toggle('a',i===k);li.classList.toggle('d',i<k)});
  const pg=$('.fc[aria-pressed=true] .pg');if(pg)pg.style.width=((k+1)/ns*100)+'%';
  typeCap(`Flow ${S.flow+1} | Step ${k+1} of ${ns}`,f.steps[k]);
  paintPlay();
}
function typeCap(head,text){
  clearTimeout(typeT);const cap=$('#cap');if(!cap)return;
  if(RM){cap.innerHTML=`<small>${esc(head)}</small>${esc(text)}`;return}
  let i=0;cap.innerHTML=`<small>${esc(head)}</small><span id="tw"></span><span class="cur"></span>`;
  const tw=$('#tw');
  (function nx(){i+=2;tw.textContent=text.slice(0,i);if(i<text.length)typeT=setTimeout(nx,22)})();
}
route_();
</script>
</body></html>
